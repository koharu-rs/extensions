name: Sites

# Sites change their pages without notice, so every one is read each day.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --test sites -- --ignored --nocapture
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pages
          path: target/tmp/sites
          if-no-files-found: ignore
