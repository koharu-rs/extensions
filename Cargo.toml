[package]
name = "koharu-extensions"
version = "0.1.0"
edition = "2024"
description = "The sites Koharu reads"
license = "MIT OR Apache-2.0"
repository = "https://github.com/koharu-rs/extensions"
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
futures = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
rand_xoshiro = "0.7.0"
reqwest = { version = "0.13.5", features = ["json"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# Koharu's own, as its interface shows these types.
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
url = "2.5.8"
