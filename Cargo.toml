[package]
name = "koharu-extensions"
version = "0.1.0"
edition = "2024"
description = "The sites Koharu reads"
license = "MIT OR Apache-2.0"
repository = "https://github.com/koharu-rs/extensions"
publish = false

[dependencies]
aes-gcm = "0.11"
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
rand_xoshiro = "0.7"
reqwest = { version = "0.13", features = ["json", "gzip"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Koharu's own, as its interface shows these types.
specta = { version = "2.0.0-rc.28", features = ["derive"] }
tar = "0.4"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
